[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are intentional immutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["backend"]
